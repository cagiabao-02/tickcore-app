# Giá trị mẫu; chủ dự án tự cấu hình DB, JWT và bảo mật khi cài đặt backend.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cinema_booking?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate # Flyway quản lý schema; Hibernate chỉ đối chiếu entity với DB.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${DB_MIGRATIONS_ENABLED:true}
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
jwt:
  secret: ${JWT_SECRET:} # Không đặt khóa thật trong mã nguồn.
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
admin:
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
booking:
  hold-duration-seconds: ${BOOKING_HOLD_DURATION_SECONDS:600}
  cleanup-delay-ms: ${BOOKING_CLEANUP_DELAY_MS:30000}
  pending-cleanup-delay-ms: ${BOOKING_PENDING_CLEANUP_DELAY_MS:30000}
  time-zone: ${BOOKING_TIME_ZONE:Asia/Ho_Chi_Minh}
payment:
  simulation-enabled: false
password-reset:
  enabled: ${PASSWORD_RESET_ENABLED:false}
  from: ${PASSWORD_RESET_FROM:}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  expiration-seconds: ${PASSWORD_RESET_EXPIRATION_SECONDS:1800}
